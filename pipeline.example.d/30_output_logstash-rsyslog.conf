# Rsyslog : output plugin
output {
    #stdout
    #{
    #    codec => rubydebug
    #}
    opensearch {
        action => "index"
        #ilm_enabled => false 
        hosts => [ "${O_Node1:localhost}", "${O_Node2:localhost}", "${O_Node3:localhost}", "${O_Node4:localhost}" ]
        ssl => "${O_SSL_ENABLE:true}"
        ssl_certificate_verification => "${O_SSL_VERIFY:false}"
        user => "${O_USER:}"
        password => "${O_PASSWD:}"
        # Ou, à la place de user/password, un certificat client (mTLS, #100) ;
        # rsyslogstach : --cacert / --tls-certificate / --tls-key.
        #cacert => "/etc/logstash/certs/ca.pem"
        #tls_certificate => "/etc/logstash/certs/client.pem"
        #tls_key => "/etc/logstash/certs/client.key"
#document_type => "_doc"
        index => "rsyslogstach-2.0.1-%{+YYYY.MM.dd}"
    }
}
