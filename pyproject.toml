[project]
name = "rsyslogstach"
version = "0.9.0"
description = "Pont rsyslog -> omprog (asyncio) -> OpenSearch, compatible schéma/filtres Logstash"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "opensearch-py[async]",
    "geoip2",
    "maxminddb",
    "pyyaml",
    "logstash-pipeline-parser==0.0.3",
    "mmh3",
    "prometheus-client==0.26.0",  # métriques /metrics (issue #35), version figée
    "ua-parser==1.0.2",
    "ua-parser-builtins==202610",
    "lxml==6.1.3",
]

[project.scripts]
# `rsyslogstach` remplace `PYTHONPATH=src python3 src/omprog.py` après
# installation (issue #31) — même point d'entrée, mêmes options.
rsyslogstach = "omprog:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.1.0",  # couverture lignes + branches, seuil bloquant (issue #73)
    "mmdb-writer>=0.2.7",  # bases .mmdb réelles générées par les tests (tests/conftest.py)
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Projet à plat (src/*.py) : la roue expose les modules au niveau RACINE
# (filters.py, omprog.py, ...) — exactement ce que faisait PYTHONPATH=src,
# tous les imports existants (`from filters import ...`, conftest, tests,
# docstrings) restent valides après `pip install rsyslogstach`.
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.wheel.shared-data]
# Issue #38 : catalogues compilés (un dossier par langue de lang/LINGUAS,
# tenus à jour par scripts/i18n-update.sh) installés dans
# <prefix>/share/locale/<locale>/LC_MESSAGES/rsyslogstach.mo, là où
# src/i18n.py les cherche. Ajouter une langue ne touche pas à ce fichier.
"lang/locale" = "share/locale"

[tool.uv]
# Issue #31 : le projet est maintenant installable (voir [build-system] et
# [tool.hatch.build.targets.wheel]) — uv installe rsyslogstach dans le venv
# en plus de résoudre/verrouiller les dépendances. Les tests continuent de
# tourner depuis l'extraction (conftest ajoute src/ au sys.path).
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Couverture des branches obligatoire (SOCLE §4, Mathilde-Team/.github#9).
branch = true
source = ["src"]

[tool.coverage.report]
# Seuil bloquant de l'équipe (décision du 21/10/2026, Mathilde-Team/.github#9),
# déclaré ici seulement : lu par `pytest --cov` dans le job Qualité de ci.yml.
fail_under = 95
show_missing = true
