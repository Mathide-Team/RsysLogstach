name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (lint, format, tests)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances (extra dev)
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatage (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        # L'import initial du projet n'est complet qu'à 1/6 (fichiers de
        # config + petits modules) : src/templates.py, référencé par
        # src/fingerprint.py, n'est pas encore poussé et tests/
        # test_fingerprint.py ne peut donc pas être collecté. Il sera
        # réintégré sans --ignore dès que les parties 2/6 à 6/6 seront
        # importées — voir l'issue de suivi « Importer les modules
        # manquants (2/6 → 6/6) ».
        run: uv run pytest -q --ignore=tests/test_fingerprint.py
